name: Cleanup Neon Preview Branches

# Preview Neon branches (`preview/<git branch>`) are created by the
# Vercel ↔ Neon integration and deleted when their PR closes
# (preview-db.yml). This catches the rest: a deleted git branch, and a
# nightly sweep of every preview branch without an open PR.

on:
  delete:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/scripts
            .github/scripts

      - name: Delete preview branch of the deleted git branch
        if: github.event_name == 'delete'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash .github/scripts/neon-delete-preview.sh "${{ github.event.ref }}"

      - name: Delete preview branches without an open PR
        if: github.event_name != 'delete'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/neon-delete-preview.sh --stale
