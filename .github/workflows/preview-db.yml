name: Preview Deployment

# Every pull request gets a Vercel preview running on a COPY OF PRODUCTION:
#
#   1. this workflow asks Vercel to build the PR's head commit
#      (Vercel does not build branch pushes itself — vercel.json
#      git.deploymentEnabled limits automatic builds to main, so only PRs
#      get previews and Neon branches),
#   2. before the build the Vercel ↔ Neon integration creates / reuses the
#      Neon branch `preview/<git branch>` from production `main` and points
#      DATABASE_URL of that deployment at it,
#   3. web/scripts/vercel-build.mjs refuses the production endpoint, applies
#      the PR's migrations to the branch and builds.
#
# When the PR is closed the Neon branch is deleted (Neon Free allows 10).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/scripts

      - name: Trigger preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TEAM="$(node web/scripts/production-db.mjs team)"
          PROJECT="$(node web/scripts/production-db.mjs vercelProject)"
          # No "target" field: preview is the API default.
          BODY="$(jq -n \
            --arg project "$PROJECT" \
            --arg repoId "${{ github.event.repository.id }}" \
            --arg ref "${{ github.head_ref }}" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            '{name: "beanmap", project: $project,
              gitSource: {type: "github", repoId: $repoId, ref: $ref, sha: $sha}}')"
          HTTP_CODE=$(curl -s -o /tmp/deploy.json -w "%{http_code}" -X POST \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=$TEAM" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            jq '{id, url, readyState}' /tmp/deploy.json
          else
            echo "::error::Preview deployment not triggered (HTTP $HTTP_CODE)."
            jq '.error // .' /tmp/deploy.json || cat /tmp/deploy.json
            exit 1
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/scripts
            .github/scripts

      - name: Delete Neon preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash .github/scripts/neon-delete-preview.sh "${{ github.head_ref }}"
