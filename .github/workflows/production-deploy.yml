name: Production Database

# Migrations are applied by the Vercel production build itself
# (web/scripts/vercel-build.mjs → `prisma migrate deploy` before `next build`),
# so new code can never go live before its schema, and a failed migration
# keeps the previous deployment online.
#
# This workflow therefore only:
#   1. on push to main: verifies production data counts (read-only), and
#   2. on manual dispatch: (re)seeds the BASE directory data (roasters, cafes,
#      cafe↔roaster relations). These seeds are idempotent upserts.
#
# Demo/fake data (reviews, analytics events, saved items, admin notes, test
# users) is NEVER written to production. Previously every migration commit
# re-ran all seeds on production, and seed_reviews.ts deleted every review.

on:
  push:
    branches: [main]
    paths:
      - "web/prisma/**"
      - ".github/workflows/production-deploy.yml"
  workflow_dispatch:
    inputs:
      seed_base_data:
        description: "Upsert base directory data (roasters, cafes, relations) into PRODUCTION"
        type: boolean
        default: false
      confirm:
        description: 'Type "production" to confirm'
        type: string
        default: ""

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  seed-base-data:
    name: Seed base data (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.seed_base_data && inputs.confirm == 'production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - name: Check migrations are applied
        run: npx prisma migrate status
      - name: Upsert roasters
        run: npx tsx prisma/seed.ts
      - name: Upsert cafes
        run: npx tsx prisma/seed_cafes.ts
      - name: Upsert cafe-roaster relations
        run: npx tsx prisma/seed_cafe_roasters_explicit.ts

  verify:
    name: Verify production data (read-only)
    needs: [seed-base-data]
    if: always() && (needs.seed-base-data.result == 'success' || needs.seed-base-data.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - name: Migration status
        run: npx prisma migrate status || echo "::warning::Pending migrations — they are applied by the next Vercel production build."
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      - name: Data integrity
        run: npx tsx prisma/verify-production.ts
