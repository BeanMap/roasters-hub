name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "ROADMAP.md"
      - "PROJECT_STATUS.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "web/AGENTS.md"
      - "docs/**"
      - ".tmp/**"
      - ".claude/**"
      - ".agents/**"

jobs:
  # ─── Job 1: Lint · Type check · Unit tests ─────────────────────────────────
  lint-typecheck-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit Tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info

  # ─── Job 2: Integration tests + Build (Neon ephemeral branch) ──────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create ephemeral Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          role: neondb_owner

      - run: npm install

      - name: Run DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          RESEND_API_KEY: re_placeholder

      - name: Delete ephemeral Neon branch
        if: always()
        run: |
          BRANCH_ID="${{ steps.neon.outputs.branch_id }}"
          PROJECT_ID="${{ secrets.NEON_PROJECT_ID }}"
          API_KEY="${{ secrets.NEON_API_KEY }}"

          if [ -n "$BRANCH_ID" ] && [ "$BRANCH_ID" != "null" ]; then
            echo "Deleting ephemeral Neon branch: $BRANCH_ID"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches/${BRANCH_ID}" \
              -H "Authorization: Bearer ${API_KEY}")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "Deleted (HTTP $HTTP_CODE)"
            else
              echo "Delete returned HTTP $HTTP_CODE — branch may be already removed"
            fi
          else
            echo "No branch_id — nothing to delete."
          fi
