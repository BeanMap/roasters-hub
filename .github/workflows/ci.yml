name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "ROADMAP.md"
      - "PROJECT_STATUS.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "web/AGENTS.md"
      - "docs/**"
      - ".tmp/**"
      - ".claude/**"
      - ".agents/**"

jobs:
  # ─── Job 1: Lint · Type check · Unit tests ─────────────────────────────────
  lint-typecheck-test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit Tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info

  # ─── Job 2: Integration tests + Build (Neon ephemeral branch) ──────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create ephemeral Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          role: neondb_owner

      - run: npm install

      - name: Run DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
          RESEND_API_KEY: re_placeholder

      - name: Delete ephemeral Neon branch
        if: always()
        run: |
          BRANCH_ID="${{ steps.neon.outputs.branch_id }}"
          PROJECT_ID="${{ secrets.NEON_PROJECT_ID }}"
          API_KEY="${{ secrets.NEON_API_KEY }}"

          if [ -n "$BRANCH_ID" ] && [ "$BRANCH_ID" != "null" ]; then
            echo "Deleting ephemeral Neon branch: $BRANCH_ID"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches/${BRANCH_ID}" \
              -H "Authorization: Bearer ${API_KEY}")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "Deleted (HTTP $HTTP_CODE)"
            else
              echo "Delete returned HTTP $HTTP_CODE — branch may be already removed"
            fi
          else
            echo "No branch_id — nothing to delete."
          fi

  # ─── Job 3: Fresh database from migrations + E2E smoke ─────────────────────
  # Builds the schema from an EMPTY Postgres using only prisma/migrations,
  # fails on drift against schema.prisma (catches `db push` shortcuts),
  # seeds demo data, builds the app and runs the Playwright smoke suite.
  e2e-fresh-db:
    name: Fresh DB + E2E Smoke
    runs-on: ubuntu-24.04  # Playwright has no browser builds for ubuntu-26.04 (ubuntu-latest) yet
    needs: lint-typecheck-test
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beanmap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beanmap
      # Live-format placeholder: avoids Clerk's dev-instance handshake redirect.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_live_placeholder
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm install

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Check schema drift (migrations vs schema.prisma)
        run: |
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script > /tmp/drift.sql
          # Only the intentionally kept legacy user_profiles columns may differ.
          if grep -vE '^(--.*|\s*|ALTER TABLE "user_profiles" DROP COLUMN "cafeId",|DROP COLUMN "roasterId";)$' /tmp/drift.sql | grep -q .; then
            echo "::error::schema.prisma differs from what the migrations create. Add a migration (prisma migrate dev) instead of db push."
            cat /tmp/drift.sql
            exit 1
          fi
          echo "No schema drift."

      - name: Seed demo data
        run: |
          npx tsx prisma/seed.ts
          npx tsx prisma/seed_cafes.ts
          npx tsx prisma/seed_cafe_roasters_explicit.ts
          npx tsx prisma/seed_user_profiles.ts
          npx tsx prisma/seed_reviews.ts
          npx tsx prisma/verify-production.ts

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app and run E2E smoke
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 1; done
          npx playwright test e2e/specs/smoke --project=chromium --project="Mobile Chrome"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e-report
          retention-days: 7
